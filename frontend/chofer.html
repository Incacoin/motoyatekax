<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MotoYaTekax Chofer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B5%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; padding: 24px; text-align: center; }
  #login input { font-size: 26px; padding: 14px; text-align: center; letter-spacing: 6px; width: 200px; }
  #loginError { color: var(--danger); min-height: 18px; font-size: 14px; }
  #app { display: none; flex-direction: column; height: 100vh; }
  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  #topbar .name { font-weight: 700; }
  #toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-dim); }
  #map { flex: 1; min-height: 0; }
  #panel { max-height: 42vh; overflow-y: auto; background: var(--bg-panel); padding: 10px; }
  .ride-card { padding: 14px; margin-bottom: 8px; }
  .ride-card .label { font-weight: 700; font-size: 15px; }
  .ride-card .meta { color: var(--text-dim); font-size: 13.5px; margin: 4px 0; }
  .ride-card .btn { width: 100%; margin-top: 8px; }
  .empty { text-align: center; color: var(--text-faint); padding: 26px 12px; font-size: 14px; }
  #switch { position: relative; width: 52px; height: 30px; background: #2a2e38; border-radius: 20px; cursor: pointer; transition: background 0.2s ease; }
  #switch .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #cfd3db; transition: left 0.18s ease, background 0.18s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  #switch.on { background: var(--success); }
  #switch.on .knob { left: 25px; background: #fff; }
  .footer-credit { padding: 10px 0 4px; }
</style>
</head>
<body>

<div id="login">
  <div class="brand"><span class="brand-icon">🛵</span>MotoYaTekax</div>
  <div style="color:var(--text-dim);">Ingresa tu PIN de chofer</div>
  <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••" />
  <button class="btn" onclick="login()">Entrar</button>
  <div id="loginError"></div>
  <div class="credit" style="position:absolute;bottom:18px;">⚡ Tecnología de <strong>Lealtad Digital</strong></div>
</div>

<div id="app">
  <div id="topbar">
    <div>
      <div class="name" id="driverName"></div>
      <div id="statusText" style="font-size:13px;color:var(--text-dim);">Desconectado</div>
    </div>
    <div id="toggle">
      <span>Disponible</span>
      <div id="switch" onclick="toggleAvailable()"><div class="knob"></div></div>
    </div>
  </div>
  <div id="map"></div>
  <div id="panel">
    <div id="rideList"></div>
    <div class="credit footer-credit">⚡ Tecnología de <strong>Lealtad Digital</strong></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = "";
let driver = null;
let ws = null;
let map, myMarker, routeLine;
const pickupMarkers = {};
let pendingRides = {};
let currentRide = null;
let available = false;
let myPos = null;

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 3200);
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function login() {
  const pin = document.getElementById("pinInput").value.trim();
  document.getElementById("loginError").textContent = "";
  try {
    const res = await fetch(API + "/api/drivers/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin }),
    });
    if (!res.ok) throw new Error((await res.json()).error || "Error");
    driver = await res.json();
    localStorage.setItem("motoya_driver", JSON.stringify(driver));
    startApp();
  } catch (e) {
    document.getElementById("loginError").textContent = e.message;
  }
}

function startApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("driverName").textContent = driver.name;

  map = L.map("map").setView([20.2098, -89.4620], 14); // Ticul aprox
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap",
  }).addTo(map);

  connectWs();
  watchLocation();
}

function connectWs() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?role=driver&driverId=${driver.id}`);
  let pingInterval;
  ws.onopen = () => {
    if (available) ws.send(JSON.stringify({ type: "status", status: "disponible" }));
    if (myPos) ws.send(JSON.stringify({ type: "location", lat: myPos.lat, lng: myPos.lng }));
    pingInterval = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
    }, 25000);
  };
  ws.onmessage = (ev) => {
    const { type, payload } = JSON.parse(ev.data);
    if (type === "new_ride") addPendingRide(payload);
    if (type === "ride_taken") removePendingRide(payload.rideId);
    if (type === "ride_cancelled" && currentRide && currentRide.id === payload.rideId) {
      currentRide = null;
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      showToast("El pasajero canceló el viaje");
      renderRideList();
    }
  };
  ws.onclose = () => {
    clearInterval(pingInterval);
    setTimeout(connectWs, 2000);
  };
}

function watchLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    (pos) => {
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!myMarker) {
        myMarker = L.marker([myPos.lat, myPos.lng], { title: "Tú" }).addTo(map);
        map.setView([myPos.lat, myPos.lng], 15);
      } else {
        myMarker.setLatLng([myPos.lat, myPos.lng]);
      }
      if (currentRide && routeLine) {
        routeLine.setLatLngs([[myPos.lat, myPos.lng], [currentRide.pickup_lat, currentRide.pickup_lng]]);
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "location", lat: myPos.lat, lng: myPos.lng }));
      }
      renderRideList();
    },
    (err) => console.warn("geo error", err),
    { enableHighAccuracy: true, maximumAge: 3000 }
  );
}

function toggleAvailable() {
  if (currentRide) return; // no se puede cambiar mientras hay viaje activo
  available = !available;
  const sw = document.getElementById("switch");
  sw.classList.toggle("on", available);
  document.getElementById("statusText").textContent = available ? "Disponible" : "Desconectado";
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "status", status: available ? "disponible" : "offline" }));
  }
  if (!available) {
    pendingRides = {};
    renderRideList();
  }
}

function addPendingRide(ride) {
  pendingRides[ride.id] = ride;
  const marker = L.circleMarker([ride.pickup_lat, ride.pickup_lng], { color: "#f6a623", radius: 8 }).addTo(map);
  pickupMarkers[ride.id] = marker;
  renderRideList();
}

function removePendingRide(id) {
  delete pendingRides[id];
  if (pickupMarkers[id]) { map.removeLayer(pickupMarkers[id]); delete pickupMarkers[id]; }
  renderRideList();
}

function renderRideList() {
  const el = document.getElementById("rideList");
  if (currentRide) {
    const dist = myPos ? haversine(myPos.lat, myPos.lng, currentRide.pickup_lat, currentRide.pickup_lng).toFixed(1) : "?";
    el.innerHTML = `
      <div class="card ride-card fade-in">
        <div class="label">Viaje en curso</div>
        <div class="meta">Pasajero: ${currentRide.rider_name} · ${currentRide.rider_phone}</div>
        <div class="meta">Recogida: ${currentRide.pickup_label || "punto marcado en el mapa"} (${dist} km)</div>
        ${currentRide.dest_label ? `<div class="meta">Destino: ${currentRide.dest_label}</div>` : ""}
        <button class="btn" onclick="completeRide()">Completar viaje</button>
      </div>`;
    return;
  }

  const rides = Object.values(pendingRides);
  if (rides.length === 0) {
    el.innerHTML = `<div class="empty">${available ? "Esperando solicitudes..." : "Actívate como disponible para recibir viajes"}</div>`;
    return;
  }
  el.innerHTML = rides.map((r) => {
    const dist = myPos ? haversine(myPos.lat, myPos.lng, r.pickup_lat, r.pickup_lng).toFixed(1) : "?";
    return `
      <div class="card ride-card fade-in">
        <div class="label">${r.rider_name}</div>
        <div class="meta">Recogida a ${dist} km${r.pickup_label ? " · " + r.pickup_label : ""}</div>
        ${r.dest_label ? `<div class="meta">Destino: ${r.dest_label}</div>` : ""}
        <button class="btn" onclick="acceptRide(${r.id})">Aceptar</button>
      </div>`;
  }).join("");
}

async function acceptRide(id) {
  const res = await fetch(API + `/api/rides/${id}/accept`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ driverId: driver.id }),
  });
  if (!res.ok) {
    removePendingRide(id);
    showToast((await res.json()).error || "Ya no disponible");
    return;
  }
  currentRide = pendingRides[id];
  pendingRides = {};
  for (const m of Object.values(pickupMarkers)) map.removeLayer(m);
  Object.keys(pickupMarkers).forEach((k) => delete pickupMarkers[k]);

  L.circleMarker([currentRide.pickup_lat, currentRide.pickup_lng], { color: "#f6a623", radius: 8 }).addTo(map);
  if (currentRide.dest_lat) {
    L.circleMarker([currentRide.dest_lat, currentRide.dest_lng], { color: "#3498db", radius: 8 }).addTo(map);
  }
  if (myPos) {
    routeLine = L.polyline([[myPos.lat, myPos.lng], [currentRide.pickup_lat, currentRide.pickup_lng]], { color: "#f6a623" }).addTo(map);
  }
  renderRideList();
}

async function completeRide() {
  await fetch(API + `/api/rides/${currentRide.id}/complete`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ driverId: driver.id }),
  });
  currentRide = null;
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  showToast("Viaje completado");
  renderRideList();
}

// Auto-login si ya había sesión
const saved = localStorage.getItem("motoya_driver");
if (saved) {
  driver = JSON.parse(saved);
  startApp();
}
</script>
</body>
</html>
